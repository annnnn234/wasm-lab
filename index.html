<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Космический Шутер</title>
    <style>
        body { background-color: #050510; color: #fff; font-family: 'Courier New', Courier, monospace; text-align: center; margin-top: 10px; }
        h1 { color: #00ffff; text-shadow: 0 0 10px #00ffff; margin-bottom: 5px; }
        canvas { border: 2px solid #00ffff; box-shadow: 0 0 20px #00ffff; background-color: #000; border-radius: 10px; }
        #info { font-size: 20px; color: #00ff00; text-shadow: 0 0 5px #00ff00; margin-bottom: 10px; }
        .controls { color: #888; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>Space Defender</h1>
    <div id="info">Очки: <span id="score">0</span> | Жизни: <span id="lives">3</span></div>
    <canvas id="gameCanvas" width="600" height="500"></canvas>
    <p class="controls">← → для движения | ПРОБЕЛ чтобы стрелять</p>
    <script src="main.js"></script>
</body>
</html>
